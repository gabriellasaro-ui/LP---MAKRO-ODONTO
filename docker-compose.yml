services:
  app:
    build: .
    container_name: lp-app
    ports:
      - "5017:5017"
    environment:
      - FLASK_ENV=production
      # WhatsApp (so digitos, DDI+DDD+numero). Vazio = padrao do app.py (telefone da unidade).
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
    restart: unless-stopped
